<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash Jet</title>
<style>
  :root { --bg:#070a18; --ink:#eef2ff; --dim:#8d96bd; --water:#5cc8ff; --goo:#8dff5a; --gold:#ffd166; --pink:#ff8fd0; --card:#11173a; --tile:#1a2150; --line:#2e3878; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas#c { display:block; border-radius:12px; box-shadow:0 0 0 1px #1f2650, 0 20px 60px #0009; cursor:crosshair; }
  #hud { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:none; gap:16px; align-items:center; font:600 15px ui-monospace,Menlo,monospace; background:#070a18cc; padding:6px 16px; border-radius:999px; border:1px solid #1f2650; pointer-events:none; white-space:nowrap; }
  #hud.on { display:flex; }
  #hud .k { color:var(--dim); margin-right:5px; font-weight:500; }
  #tankBar { width:80px; height:10px; border-radius:5px; background:#1f2650; overflow:hidden; display:inline-block; vertical-align:middle; }
  #tankFill { display:block; height:100%; width:100%; background:var(--water); }
  .corner { position:absolute; top:10px; right:12px; display:flex; gap:8px; z-index:5; }
  .corner button { width:40px; height:40px; padding:0; border-radius:50%; background:#070a18cc; border:1px solid #1f2650; font-size:17px; }
  .overlay { position:absolute; inset:0; display:flex; background:#04060fe0; overflow:auto; padding:16px; touch-action:pan-y; }
  .overlay.hidden { display:none; }
  .card { width:min(680px,96vw); background:var(--card); border:1px solid #29326b; border-radius:20px; padding:22px; text-align:center; margin:auto; position:relative; }
  h1 { margin:0 0 4px; font-size:34px; }
  h1 span { color:var(--water); }
  h2 { margin:0 0 12px; font-size:24px; }
  .sub { color:var(--dim); margin:0 0 12px; font-size:14px; line-height:1.45; }
  .who { display:flex; align-items:center; gap:12px; text-align:left; background:var(--tile); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin:8px 0 10px; }
  .who .av { font-size:34px; }
  .who .nm { font-weight:800; font-size:17px; }
  .who .tt { color:var(--gold); font-size:13px; font-weight:700; }
  .xpbar { height:8px; background:#0b1030; border-radius:4px; overflow:hidden; margin-top:5px; }
  .xpbar i { display:block; height:100%; background:linear-gradient(90deg,#5cc8ff,#c49bff); }
  .wallet { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 12px; }
  .pill { background:var(--tile); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font:700 14px ui-monospace,Menlo,monospace; }
  .play { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px; }
  .tile.battle { background:linear-gradient(135deg,#5a1a1a,#3a1a5a); border-color:#ff9f43; }
  .tile.party { background:linear-gradient(135deg,#5a2a4a,#2a3a6a); border-color:#ff8fd0; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:560px){ .play { grid-template-columns:1fr 1fr; } .play .hot { grid-column:1/-1; } .tiles { grid-template-columns:repeat(4,1fr); gap:6px; } }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:12px 6px; border-radius:14px; background:var(--tile); border:1px solid var(--line); min-height:84px; }
  .tile .ic { font-size:28px; line-height:1; }
  .tile b { font-size:14px; }
  .tile small { color:var(--dim); font-weight:500; font-size:11.5px; line-height:1.3; }
  .tile.hot { background:linear-gradient(135deg,#1d4f7a,#3b2a7a); border-color:#5cc8ff; }
  .tile.titan { background:linear-gradient(135deg,#3a1a5a,#1a3a2a); border-color:#c49bff; }
  .tile:disabled { opacity:.5; cursor:default; }
  .badge { position:absolute; top:6px; right:8px; background:#ff4d6d; color:#fff; font-size:11px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px; }
  .note { min-height:20px; color:var(--gold); font-weight:700; margin-top:10px; line-height:1.5; }
  .how { font-size:12.5px; color:var(--dim); margin-top:12px; line-height:1.6; }
  kbd { background:#1f2650; border:1px solid #3a4590; border-bottom-width:3px; border-radius:6px; padding:1px 6px; font:600 11px ui-monospace,Menlo,monospace; color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-bottom:16px; }
  .lvl { padding:14px 8px; border-radius:14px; background:var(--tile); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .lvl .n { font-size:26px; } .lvl .t { font-size:13px; } .lvl .s { color:var(--gold); letter-spacing:2px; font-size:14px; }
  .lvl.boss { border-color:#8dff5a; background:linear-gradient(160deg,#1a3a1a,#2a1a4a); }
  .lvl:disabled { opacity:.4; cursor:default; }
  .sec { text-align:left; font-weight:800; margin:14px 0 8px; color:var(--dim); font-size:12.5px; letter-spacing:1px; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; }
  .item { padding:10px 6px; border-radius:12px; background:var(--tile); border:2px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12.5px; position:relative; }
  .item .sw { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .item.on { border-color:var(--gold); box-shadow:0 0 0 2px #ffd16633; }
  .item .p { color:var(--dim); font-weight:600; font-size:11.5px; }
  .item.locked { opacity:.55; }
  .pal .em { font-size:34px; line-height:1.1; }
  .pal.shiny .em { filter:hue-rotate(160deg) saturate(1.6) drop-shadow(0 0 6px #fff); }
  .rar { font-size:10.5px; font-weight:800; letter-spacing:.5px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .packbtn { flex:1; min-width:150px; padding:12px; border-radius:14px; background:var(--tile); border:2px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:2px; }
  .packbtn .em { font-size:30px; } .packbtn small { color:var(--dim); font-weight:500; font-size:11px; }
  .buddybox { display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,#1a2a5a,#2a1a4a); border:1px solid #4a5aa8; border-radius:14px; padding:12px 16px; text-align:left; }
  .buddybox .em { font-size:46px; }
  .egg { display:flex; align-items:center; gap:10px; background:var(--tile); border:1px solid var(--line); border-radius:12px; padding:8px 12px; flex:1; min-width:180px; }
  .egg .em { font-size:28px; }
  .bar { flex:1; height:10px; background:#0b1030; border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#8dff5a,#5cc8ff); }
  .quest { display:flex; align-items:center; gap:12px; background:var(--tile); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; text-align:left; }
  .quest .ic { font-size:24px; }
  .quest .body { flex:1; } .quest .body b { font-size:14px; } .quest .body small { color:var(--dim); font-size:12px; }
  .tier { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; background:var(--tile); border:1px solid var(--line); margin-bottom:6px; text-align:left; }
  .tier .lv { font:800 14px ui-monospace,Menlo,monospace; width:52px; color:var(--dim); }
  .tier .rw { flex:1; font-size:14px; }
  .tier.got { opacity:.55; } .tier.ready { border-color:var(--gold); }
  .award { padding:12px 8px; border-radius:12px; background:var(--tile); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; }
  .award .em { font-size:30px; } .award.no { opacity:.4; filter:grayscale(1); }
  .award small { color:var(--dim); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; text-align:left; font-size:14px; }
  .stats div { background:var(--tile); border-radius:10px; padding:8px 12px; } .stats b { float:right; font-family:ui-monospace,Menlo,monospace; }
  input[type=text] { font:inherit; font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0b1030; color:var(--ink); width:200px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  button { font:inherit; font-weight:700; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; background:#1f2650; color:var(--ink); }
  button.primary { background:var(--water); color:#03121d; }
  button.gold { background:var(--gold); color:#2a1d00; }
  button.small { padding:6px 12px; font-size:13px; }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .stars { font-size:44px; letter-spacing:6px; margin:4px 0; color:var(--gold); }
  .big { font:700 22px ui-monospace,Menlo,monospace; margin:2px 0 6px; }
  .break { font:500 14px ui-monospace,Menlo,monospace; color:var(--dim); line-height:1.6; }
  .tag { font:700 17px ui-monospace,Menlo,monospace; color:var(--gold); margin:4px 0 10px; }
  .back { position:absolute; top:14px; left:14px; }
  /* reveal */
  #reveal { z-index:8; }
  .rrow { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:16px 0 6px; }
  .rcard { width:150px; padding:16px 10px; border-radius:16px; background:#0b1030; border:3px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .rcard .em { font-size:60px; line-height:1.1; }
  .rcard.shake .em { animation:shake .9s ease-in-out; }
  .rcard.pop { animation:pop .45s ease-out; }
  .rcard.shiny .em { filter:hue-rotate(160deg) saturate(1.6) drop-shadow(0 0 10px #fff); }
  .rcard b { font-size:16px; } .rcard small { color:var(--dim); font-size:12px; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 15%{transform:rotate(-14deg) scale(1.05)} 30%{transform:rotate(12deg)} 45%{transform:rotate(-10deg) scale(1.1)} 60%{transform:rotate(8deg)} 75%{transform:rotate(-5deg) scale(1.15)} }
  @keyframes pop { 0%{transform:scale(.4)} 70%{transform:scale(1.12)} 100%{transform:scale(1)} }
  #confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #confetti i { position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  #toasts { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:9; pointer-events:none; }
  .toast { background:#1a2150f2; border:1px solid var(--gold); color:var(--ink); padding:8px 16px; border-radius:999px; font-weight:700; font-size:14px; animation:toast 3s ease forwards; white-space:nowrap; }
  @keyframes toast { 0%{opacity:0; transform:translateY(10px)} 10%{opacity:1; transform:none} 85%{opacity:1} 100%{opacity:0} }
  #touch { position:absolute; left:0; right:0; bottom:14px; display:none; justify-content:space-between; padding:0 14px; pointer-events:none; z-index:4; }
  #touch .grp { display:flex; gap:12px; pointer-events:auto; }
  #touch button { width:64px; height:64px; border-radius:50%; background:#ffffff1c; border:2px solid #ffffff40; font-size:22px; padding:0; }
  body.playing #touch { display:flex; }
  @media (pointer:fine) { body.playing #touch { display:none; } }
  .qopts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .qopt { padding:16px 10px; font-size:17px; border-radius:14px; background:var(--tile); border:2px solid var(--line); }
  .qopt.right { background:#1f6a2a; border-color:#8dff5a; } .qopt.wrong { background:#6a1f2a; border-color:#ff6b8a; }
  .qtext { font-size:24px; font-weight:800; margin:6px 0 4px; line-height:1.3; }
  .worldhead { grid-column:1/-1; text-align:left; font-weight:800; color:var(--gold); margin-top:6px; }
  #wheel { display:block; margin:6px auto; max-width:100%; }
  .chatlog { text-align:left; background:#080d27; border:1px solid var(--line); border-radius:12px; padding:10px; min-height:150px; max-height:260px; overflow:auto; user-select:text; }
  .chatmsg { padding:6px 9px; margin:5px 0; border-radius:10px; background:#1a2150; overflow-wrap:anywhere; }
  .chatmsg b { color:var(--water); margin-right:6px; }
  .chatinput { display:flex; gap:8px; margin-top:9px; }
  .chatinput input { min-width:0; flex:1; }
  #edTop, #edBot { position:absolute; left:50%; transform:translateX(-50%); display:none; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; background:#070a18e6; border:1px solid #2e3878; border-radius:14px; padding:6px 8px; z-index:6; width:min(960px,98vw); }
  #edTop { top:8px; } #edBot { bottom:8px; }
  body.editing #edTop, body.editing #edBot { display:flex; }
  #edTop input[type=text] { width:150px; padding:6px 10px; font-size:14px; }
  #edTop select, #edTop input[type=range] { accent-color:var(--water); }
  #edTop select { font:inherit; font-size:13px; padding:5px; border-radius:8px; background:#0b1030; color:var(--ink); border:1px solid var(--line); }
  .tool { padding:6px 9px; font-size:13px; border-radius:10px; background:var(--tile); border:2px solid var(--line); }
  .tool.on { border-color:var(--gold); background:#3a2e10; }
  #edInfo { font:600 12px ui-monospace,monospace; color:var(--dim); }
  .corner button.music-on { border-color:var(--gold); box-shadow:0 0 12px #ffd16655; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540" aria-label="Splash Jet game"></canvas>
  <div id="hud">
    <div><span class="k" id="hTimeK">TIME</span><span id="hTime">2:30</span></div>
    <div><span class="k" id="hGooK">GOO</span><span id="hGoo">0</span></div>
    <div><span class="k">💎</span><span id="hGems">0</span></div>
    <div><span class="k">TANK</span><span id="tankBar"><span id="tankFill"></span></span></div>
  </div>
  <div class="corner">
    <button id="muteBtn" aria-label="Toggle sound">🔊</button>
    <button id="musicBtn" aria-label="Toggle background music" title="Background music">🎵</button>
    <button id="quitBtn" aria-label="Quit to menu" style="display:none">✕</button>
  </div>

  <div class="overlay" id="home"><div class="card" id="homeCard"></div></div>
  <div class="overlay hidden" id="map">
    <div class="card"><button class="back small" data-home>← Home</button><h2>🗺️ Adventure</h2><div class="grid" id="lvlGrid"></div></div>
  </div>
  <div class="overlay hidden" id="panel">
    <div class="card"><button class="back small" data-home>← Home</button><h2 id="pTitle"></h2><div id="pBody"></div><div class="note" id="pNote"></div></div>
  </div>
  <div class="overlay hidden" id="done">
    <div class="card">
      <h1 id="doneTitle"></h1><div class="tag" id="doneName"></div><div class="stars" id="doneStars"></div>
      <div class="big" id="doneScore"></div><div class="break" id="doneBreak"></div><div class="note" id="doneNote"></div>
      <div class="btns" id="doneBtns"></div>
    </div>
  </div>
  <div class="overlay hidden" id="quiz"><div class="card" id="quizCard"></div></div>
  <div class="overlay hidden" id="reveal"><div id="confetti"></div><div class="card" id="revealCard"></div></div>
  <div id="touch"><div class="grp"><button data-k="left" aria-label="Walk left">◀</button><button data-k="right" aria-label="Walk right">▶</button></div><div class="grp"><button data-k="dash" aria-label="Dash">💨</button><button data-k="emote" aria-label="Emote">😄</button><button data-k="jump" aria-label="Jump">⤒</button></div></div>
  <div id="edTop">
    <input type="text" id="edName" maxlength="24" placeholder="Level name" aria-label="Level name">
    <label style="font-size:12px;color:var(--dim)">🎨 <input type="range" id="edHue" min="0" max="359" aria-label="Background colour"></label>
    <select id="edTime" aria-label="Time limit"><option value="60">⏱ 1:00</option><option value="90">⏱ 1:30</option><option value="120">⏱ 2:00</option><option value="150">⏱ 2:30</option><option value="180">⏱ 3:00</option><option value="240">⏱ 4:00</option></select>
    <select id="edGrav" aria-label="Gravity"><option value="1">🌍 Normal gravity</option><option value="0.7">🎈 Floaty</option><option value="1.3">🪨 Heavy</option></select>
    <button class="tool" data-ed="undo" title="Undo">↩️ Undo</button>
    <button class="tool" data-ed="test" style="border-color:#8dff5a">▶ Test</button>
    <button class="tool" data-ed="save" style="border-color:#5cc8ff">💾 Save</button>
    <button class="tool" data-ed="exit">✕ Exit</button>
    <span id="edInfo"></span>
  </div>
  <div id="edBot"></div>
  <div id="toasts" aria-live="polite"></div>
</div>

    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();

}

function startMusic(theme){

    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();

function toCanvas(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height }; }
cv.addEventListener("pointerdown", e => { e.preventDefault(); const p = toCanvas(e); pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.active = true; try { cv.setPointerCapture(e.pointerId); } catch(_){} });

cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

addEventListener("keydown", e => {

  if (e.code === "KeyQ"){ keys.aimL = true; pointer.active = false; }
  if ((e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyC") && !e.repeat){ dashBuf = 0.15; }
  if (/^Digit[1-6]$/.test(e.code) && running) doEmote(+e.code.slice(5) - 1);
  if (e.code === "KeyE"){ keys.aimR = true; pointer.active = false; }
  if (e.code === "Space" || e.code === "KeyX"){ keys.fire = true; if (running) e.preventDefault(); }
  if (e.code === "Escape" && running) quit();
});
addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  if (e.code === "Space" || e.code === "KeyX") keys.fire = false;

function circleRect(px, py, p){
  const cx = clamp(px, p.x, p.x + p.w), cy = clamp(py, p.y, p.y + p.h), dx = px - cx, dy = py - cy, d2 = dx*dx + dy*dy;
  if (d2 >= R*R) return null; if (d2 === 0) return { nx:0, ny:-1, pen:R };
  const d = Math.sqrt(d2); return { nx:dx/d, ny:dy/d, pen:R - d };
}
function burst(x, y, c, n, sp){ sp = sp || 260; for (let k=0;k<n;k++) parts.push({ x, y, vx:(Math.random()-.5)*sp, vy:-Math.random()*sp*0.9, l:0.5+Math.random()*0.35, c }); }

function floatText(x, y, t, c){ floats.push({ x, y, t, c: c || "#ffd166", l: 1 }); }

const grav = () => BASE_GRAV * (opts.grav || 1);

function addGems(v){ if (pw.star) v *= 2; if (weekEvent().id === "gems2" && running) v *= 2; if (perk.gems && Math.random()*100 < perk.gems){ v *= 2; floatText(P.x, P.y - 40, "DOUBLE! 💎", "#ff8fd0"); } runGems += v; if (mode !== "custom") track("gems", v); return v; }

function blast(){

function update(dt){
  tAnim += dt;
  for (const p of plats) if (p.type === "move"){ const ny = p.base + Math.sin(tAnim*p.sp + p.ph)*p.amp; p.dy = ny - p.y; p.y = ny; }
  for (const q of parts){ q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 400*dt; q.l -= dt; }
  parts = parts.filter(q => q.l > 0);
  for (const f of floats){ f.y -= 40*dt; f.l -= dt; }
  floats = floats.filter(f => f.l > 0);
  for (const g of goos) if (g.eek > 0) g.eek -= dt;
  if (msgT > 0) msgT -= dt; if (flash > 0) flash -= dt; if (comboT > 0) comboT -= dt; if (buddyTalkT > 0) buddyTalkT -= dt;
  if (!running) return;
  if (mode === "dash"){ if (shake > 0) shake -= dt; return dashUpdate(dt); }
  if (mode === "race" && RC && RC.count > 0){ const before = Math.ceil(RC.count); RC.count -= dt; if (Math.ceil(RC.count) !== before) RC.count > 0 ? tone(440, 440, 0.15, "square", 0.06) : tone(880, 880, 0.3, "square", 0.08); return; }
  for (const k in pw){ pw[k] -= dt; if (pw[k] <= 0){ delete pw[k]; } }
  if (endT > 0){ endT -= dt; if (endT <= 0) finish(true); return; }

  timeLeft -= dt;
  if (timeLeft <= 0){ timeLeft = 0; return finish(mode === "party"); }

  if (pointer.active) P.aim = Math.atan2(pointer.y - P.y, pointer.x + camX - P.x + 0.0001);
  if (keys.aimL) P.aim -= 3.2*dt;
  if (keys.aimR) P.aim += 3.2*dt;
  P.cd -= dt; if (P.sticky > 0) P.sticky -= dt;
  if (pointer.down || keys.fire) blast();

  if (P.ground && P.ground.type === "move") P.y += P.ground.dy;
  if (shake > 0) shake -= dt;
  P.vy += grav()*dt;
  P.vx *= Math.pow(0.985, dt*60);
  // walking + jumping
  const mv = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), RUN = 230;
  if (mv){ const acc = P.ground ? (P.ground.type === "ice" ? 500 : 1800) : 700; if (mv*P.vx < RUN) P.vx = mv > 0 ? Math.min(RUN, P.vx + acc*dt) : Math.max(-RUN, P.vx - acc*dt); if (!pointer.active && !keys.aimL && !keys.aimR) P.aim = S.classicJet ? (mv > 0 ? Math.PI*0.62 : Math.PI*0.38) : (mv > 0 ? Math.PI*0.25 : Math.PI*0.75); if (P.ground) P.walk = (P.walk || 0) + dt*14; }
  if (P.ground) coyote = 0.1; else coyote -= dt;
  jumpBuf -= dt;
  if (jumpBuf > 0 && coyote > 0){ P.vy = -400; P.ground = null; coyote = 0; jumpBuf = 0; P.squish = 0.5; burst(P.x, P.y + R, "#ccd6ff", 6, 120); tone(300, 600, 0.12, "sine", 0.08); }
  else if (jumpBuf > 0 && !P.ground && !P.dj && !P.pound && coyote <= 0){ P.dj = true; P.vy = Math.min(P.vy, -370); jumpBuf = 0; P.squish = 0.6; for (let k=0;k<14;k++){ const a = k/14*Math.PI*2; parts.push({ x:P.x, y:P.y + R, vx:Math.cos(a)*160, vy:Math.sin(a)*60, l:0.35, c: k%2 ? "#ffd166" : "#ffffff" }); } tone(500, 1000, 0.12, "sine", 0.08); }
  dashBuf -= dt; if (P.dashCd > 0) P.dashCd -= dt; if (P.dashT > 0) P.dashT -= dt; if (P.respawnT > 0) P.respawnT -= dt;
  if (dashBuf > 0 && !(P.dashCd > 0)){ const dd = mv || (Math.cos(P.aim) >= 0 ? 1 : -1); P.vx = dd*580; P.vy = Math.min(P.vy, -40); P.dashCd = 0.9; P.dashT = 0.2; dashBuf = 0; tone(700, 300, 0.15, "sawtooth", 0.05); for (let k=0;k<12;k++) parts.push({ x:P.x - dd*k*4, y:P.y + (Math.random()-.5)*14, vx:-dd*120, vy:0, l:0.3, c:"#9be0ff" }); }
  if (P.dashT > 0 && Math.random() < 0.8) parts.push({ x:P.x, y:P.y + (Math.random()-.5)*16, vx:-Math.sign(P.vx)*80, vy:0, l:0.25, c: suitColor() });
  if (!(P.dashT > 0) && Math.abs(P.vx) > RUN + 10 && !S.classicJet) P.vx *= Math.pow(0.9, dt*60);
  if (P.ground && !mv){ P.vx *= Math.pow(P.ground.type === "ice" ? 0.99 : 0.86, dt*60); }
  // ground pound
  downBuf -= dt;
  if (downBuf > 0 && !P.ground && !P.pound){ P.pound = true; P.vy = 780; P.vx *= 0.3; downBuf = 0; tone(500, 200, 0.15, "square", 0.05); }
  // updraft fans
  for (const f of fans){ if (f.geyser){ if (geyserOn(f) && P.x > f.x - 4 && P.x < f.x + f.w + 4 && P.y > 90){ P.vy -= 2300*dt; if (P.vy < -600) P.vy = -600; P.pound = false; if (Math.random() < 0.4) parts.push({ x: f.x + Math.random()*f.w, y: P.y + 16, vx:(Math.random()-.5)*60, vy:-260, l:0.35, c: pick(["#ff9f43","#ffd166","#ff6b3a"]) }); } continue; } if (P.x > f.x && P.x < f.x + f.w && P.y > 110){ P.vy -= 1150*dt; if (P.vy < -380) P.vy = -380; P.pound = false; if (Math.random() < 0.3) parts.push({ x: f.x + Math.random()*f.w, y: P.y + 20, vx:0, vy:-200, l:0.3, c:"#dff6ff" }); } }
  if (P.ground){ P.tank = Math.min(tankMax, P.tank + REFILL*dt); }
  else P.tank = Math.min(tankMax, P.tank + AIR_REFILL*dt);
  P.x += P.vx*dt; P.y += P.vy*dt;
  if (P.squish > 0) P.squish -= dt*4;
  if (P.x < R){ P.x = R; P.vx = Math.abs(P.vx)*0.6; }
  if (P.x > worldW - R){ P.x = worldW - R; P.vx = -Math.abs(P.vx)*0.6; }
  if (P.y < R + 46){ P.y = R + 46; P.vy = Math.abs(P.vy)*0.5; }

  let grounded = null;

function bossScale(){ return boss.titan ? 0.55 + 0.45 * boss.hp / boss.max : 0.45 + 0.55 * Math.max(0, boss.hp) / boss.max; }
function updateBoss(dt){
  boss.t += dt; if (boss.flash > 0) boss.flash -= dt; if (boss.talkT > 0) boss.talkT -= dt;
  if (boss.hp <= 0) return;
  boss.x = 1000 + Math.sin(boss.t*0.45)*290; boss.y = 195 + Math.sin(boss.t*1.3)*40;
  boss.spit -= dt;
  if (boss.spit <= 0){
    const angry = boss.hp < boss.max/2;
    boss.spit = boss.titan ? (angry ? 2 : 2.6) : (angry ? 2.6 : 3.6);
    const n = boss.titan ? (angry ? 4 : 3) : (angry ? 3 : 2);
    for (let k=0;k<n;k++) balls.push({ x:boss.x, y:boss.y + 20, vx:(Math.random()-.5)*520, vy:-150 - Math.random()*200, l:6 });
    if (Math.random() < 0.5){ boss.talk = pick(boss.magma ? ["Sizzle sizzle!","Too hot to handle!","Lava goo party!","Feel the heat!"] : boss.queen ? ["Freeze!","Snow goo for everyone!","Ice to meet you!","Chill out!"] : boss.titan ? ["GLOOOORP!","The whole galaxy will be GOO!","You'll never clean me!","MEGA BLOOP!"] : ["Bloop! More goo!","Mine! All mine!","You can't clean ME!","Gloop gloop!"]); boss.talkT = 1.8; }
  }
  for (const b of balls){
    b.vy += grav()*0.8*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.l -= dt;
    if (b.y > SLIME_Y){ b.l = 0; burst(b.x, SLIME_Y, "#5fd13a", 6); continue; }
    if (Math.hypot(b.x - P.x, b.y - P.y) < R + 10){ b.l = 0; P.sticky = 2; P.tank = Math.max(0, P.tank - 8); burst(P.x, P.y, "#5fd13a", 14); say("Sticky! 🟢 (sprays weaker for 2s)", "#8dff5a"); sfx.sticky(); continue; }
    for (const p of plats){
      if (b.x > p.x && b.x < p.x + p.w && b.y > p.y - 6 && b.y < p.y + p.h){
        b.l = 0; burst(b.x, p.y, "#5fd13a", 8);
        if (p.type !== "bounce" && goos.filter(g => g.hp > 0).length < 7){ const gw = 44; goos.push({ p, off: clamp(b.x - p.x - gw/2, 6, p.w - gw - 6), w:gw, hp:2, max:2, mega:false, wob:Math.random()*6, eek:0 }); }
        break;
      }
    }
  }
  balls = balls.filter(b => b.l > 0);
}

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mathQ(g){
  const r = (a,b) => a + Math.floor(Math.random()*(b-a+1)); let text, ans;
  if (g <= 1){ const a = r(1,10), b = r(1,10); if (Math.random() < 0.5){ text = `${a} + ${b} = ?`; ans = a + b; } else { const x = Math.max(a,b), y = Math.min(a,b); text = `${x} − ${y} = ?`; ans = x - y; } }
  else if (g === 2){ const a = r(10,60), b = r(5,39); if (Math.random() < 0.5){ text = `${a} + ${b} = ?`; ans = a + b; } else { text = `${a + b} − ${b} = ?`; ans = a; } }
  else if (g === 3){ const a = r(2,10), b = r(2,10); if (Math.random() < 0.6){ text = `${a} × ${b} = ?`; ans = a*b; } else { text = `${a*b} ÷ ${a} = ?`; ans = b; } }
  else if (g === 4){ const a = r(11,49), b = r(2,9); if (Math.random() < 0.5){ text = `${a} × ${b} = ?`; ans = a*b; } else { text = `${a*b} ÷ ${b} = ?`; ans = a; } }
  else if (g === 5){ const d = pick([2,4,5,10]), n = d * r(2,12); text = `What is 1/${d} of ${n}?`; ans = n / d; }
  else if (g === 6){ const pc = pick([10,20,25,50]), n = pick([40,60,80,100,120,200]); text = `What is ${pc}% of ${n}?`; ans = n*pc/100; }
  else if (g === 7){ const a = r(-12,12), b = r(-12,12); text = `${a} + (${b}) = ?`; ans = a + b; }
  else { const x = r(1,12), a = r(2,9), b = r(1,20); text = `Solve: ${a}x + ${b} = ${a*x + b}. x = ?`; ans = x; }
  const opts = new Set([ans]); while (opts.size < 4){ const o = ans + pick([-10,-5,-3,-2,-1,1,2,3,4,5,10]); if (g < 7 && o < 0) continue; opts.add(o); }
  const list = shuffle([...opts].map(String));
  return { subj:"Math", icon:"➗", text, opts:list, ans:list.indexOf(String(ans)) };
}
function makeQuestion(){

}

function drawAstronaut(x, y){

  if (wb){ ctx.fillStyle = "#4b5aa8"; const ph = Math.sin(P.walk || 0); ctx.fillRect(-7 + ph*3, R - 3, 5, 5 - wb*0.3); ctx.fillRect(2 - ph*3, R - 3, 5, 5); }

function drawHat(){

  if (h === "star"){ ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, -R - 5, 11, 3.5, 0, 0, 7); ctx.stroke(); for (let k=0;k<3;k++){ const a = tAnim*3 + k*2.1; ctx.fillStyle = "#fff6c2"; ctx.fillRect(Math.cos(a)*11 - 1.5, -R - 5 + Math.sin(a)*3.5 - 1.5, 3, 3); } }
  if (h === "cat"){ ctx.fillStyle = suitColor(); ctx.beginPath(); ctx.moveTo(-10, -R + 4); ctx.lineTo(-7, -R - 8); ctx.lineTo(-2, -R + 1); ctx.moveTo(10, -R + 4); ctx.lineTo(7, -R - 8); ctx.lineTo(2, -R + 1); ctx.fill(); ctx.fillStyle = "#ffb3d1"; ctx.beginPath(); ctx.moveTo(-8, -R + 1); ctx.lineTo(-7, -R - 4); ctx.lineTo(-4, -R + 1); ctx.moveTo(8, -R + 1); ctx.lineTo(7, -R - 4); ctx.lineTo(4, -R + 1); ctx.fill(); }

  if (h === "horns"){ ctx.fillStyle = "#ff6b8a"; ctx.beginPath(); ctx.moveTo(-10, -R + 4); ctx.quadraticCurveTo(-16, -R - 10, -7, -R - 12); ctx.quadraticCurveTo(-8, -R - 4, -4, -R + 1); ctx.fill(); ctx.beginPath(); ctx.moveTo(10, -R + 4); ctx.quadraticCurveTo(16, -R - 10, 7, -R - 12); ctx.quadraticCurveTo(8, -R - 4, 4, -R + 1); ctx.fill(); }

function fmt(t){ t = Math.max(0, Math.ceil(t)); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); }
function hud(){
  if (!running) return;
  if (mode === "dash"){ $("hTimeK").textContent = "TRY"; $("hTime").textContent = D.attempt; $("hTime").style.color = ""; $("hGooK").textContent = "DONE"; $("hGoo").textContent = Math.floor(D.prog*100) + "%"; $("hGems").textContent = D.gemsRun; $("tankFill").style.width = D.tank + "%"; $("tankFill").style.background = D.tank <= 0 ? "#ff6b8a" : ""; return; }
  if (mode === "race" && RC){ $("hTimeK").textContent = "TIME"; $("hTime").textContent = RC.time.toFixed(1) + "s"; $("hTime").style.color = ""; $("hGooK").textContent = "PLACE"; $("hGoo").textContent = racePlace() + "/4"; $("hGems").textContent = runGems; $("tankFill").style.width = (100*P.tank/tankMax) + "%"; return; }
  if (mode === "battle" && BT){ $("hTimeK").textContent = ""; $("hTime").textContent = "❤️".repeat(BT.hearts) + "🖤".repeat(Math.max(0, BT.maxHearts - BT.hearts)); $("hTime").style.color = ""; $("hGooK").textContent = "WAVE"; $("hGoo").textContent = BT.wave + "/" + BATTLES[BT.tier].waves; $("hGems").textContent = runGems; $("tankFill").style.width = (100*P.tank/tankMax) + "%"; return; }
  $("hTimeK").textContent = "TIME";
  $("hTime").textContent = fmt(timeLeft); $("hTime").style.color = timeLeft < 15 ? "#ff6b8a" : "";
  if (mode === "party"){ $("hGooK").textContent = "SCORE"; $("hGoo").textContent = partyScore; }
  else if (boss){ $("hGooK").textContent = boss.titan ? "TITAN" : "BOSS"; $("hGoo").textContent = Math.ceil(100*Math.max(0,boss.hp)/boss.max) + "%"; }
  else { $("hGooK").textContent = "GOO"; $("hGoo").textContent = goos.filter(g => g.hp > 0).length + " left"; }
  $("hGems").textContent = runGems;
  $("tankFill").style.width = (100*P.tank/tankMax) + "%"; $("tankFill").style.background = P.tank < 8 ? "#ff6b8a" : "";
}

    runGems = 0; runGoo = 0; xp = 0;
    $("doneTitle").innerHTML = clean ? 'Level <span>complete!</span>' : 'So <span>close!</span>';
    $("doneName").textContent = "🛠️ " + (L && L.name || "My Level");
    $("doneScore").textContent = clean ? `Cleaned all ${total} goo with ${fmt(timeLeft)} left!` : `Goo ${cleaned}/${total}`;
    $("doneBreak").innerHTML = "Custom levels are just for fun — no gems or XP, so nobody can farm the leaderboard 😉";
    if (ED.testing){ addBtn("Back to editor", openEditor, true); addBtn(clean ? "Test again" : "Try again", () => playCustom(L, true)); }
    else { addBtn(clean ? "Play again" : "Try again", () => playCustom(L, false), true); addBtn("My Levels", renderEditorMenu); addBtn("Home", goHome); }
  } else if (mode === "race"){
    const R = RC.R, place = clean ? RC.racers.filter(r => r.done).length + 1 : 4, prize = [100, 50, 25, 10][place - 1];
    runGems += prize; xp += 25 + (4 - place)*15;
    const rec = S.races[R.id] || (S.races[R.id] = { best:0, place:0 });
    if (clean && (!rec.best || RC.time < rec.best)){ if (rec.best) notes.push("⏱ New best time!"); rec.best = Math.round(RC.time*10)/10; }
    if (!rec.place || place < rec.place) rec.place = place;
    if (place === 1){ S.shards += 1; track("raceWins", 1); notes.push("🥇 Winner bonus: +1 ✨"); }
    if (R.id === "daily" && place <= 3 && S.raceDaily !== today()){ S.raceDaily = today(); S.shards += 1; runGems += 40; notes.push("📅 Daily race podium: +1 ✨ + 40 💎"); }
    $("doneTitle").innerHTML = ["🥇 1st <span>place!</span>","🥈 2nd <span>place!</span>","🥉 3rd <span>place!</span>","4th <span>place</span>"][place - 1];
    $("doneName").textContent = R.icon + " " + R.name;
    $("doneScore").textContent = clean ? RC.time.toFixed(1) + " seconds" : "Didn't finish in time";
    $("doneBreak").innerHTML = `Prize 💎 ${prize} · Gems found 💎 ${runGems - prize}<br>Finish order: ${RC.order.concat(clean ? [] : ["You"]).join(" → ")}`;
    if (place > 3) notes.push("Tip: Shift to dash, ↑↑ to double jump!");
    addBtn("Race again", () => startRace(R.id), true); addBtn("Races", renderRaces); addBtn("Home", goHome);
  } else if (mode === "battle" && BT.tier === 3){
    const F = farmState(), grow = F.plots.filter(pl => pl && !farmReady(pl));
    xp += 20 + BT.cleaned*2;
    $("doneTitle").innerHTML = clean ? 'Farm <span>saved!</span> 🌾' : 'The monsters <span>got in!</span>';
    $("doneName").textContent = "🌾 Farm Defense";
    $("doneScore").textContent = BT.cleaned + " monsters chased away";
    if (clean){ S.stats.defends = (S.stats.defends || 0) + 1; runGems += 50; grow.forEach(pl => pl.t0 -= pl.dur*0.25); $("doneBreak").innerHTML = `Your crops are safe and grew 25% faster!<br>+50 💎 defense bonus`; }
    else { const v = grow.length ? pick(grow) : null; if (v) v.t0 = Math.min(Date.now(), v.t0 + v.dur*0.5); $("doneBreak").innerHTML = v ? `A monster nibbled your ${SEED(v.seed).name} — it lost half its growth.` : "Luckily there was nothing to eat!"; }
    F.pest = null; save();
    addBtn("Back to farm", renderFarm, true); addBtn("Home", goHome);
  } else if (mode === "battle"){
    const bt = BATTLES[BT.tier], rec = S.battle[BT.tier] || (S.battle[BT.tier] = { wins:0, best:0 });
    rec.best = Math.max(rec.best, clean ? bt.waves : BT.wave - 1);
    xp += 30 + BT.cleaned*3 + (clean ? 80 + BT.tier*60 : 0);
    $("doneTitle").innerHTML = clean ? 'VICTORY! <span>🏆</span>' : 'Out of <span>hearts!</span>';
    $("doneName").textContent = bt.icon + " " + bt.name;
    $("doneScore").textContent = BT.cleaned + " monsters cleaned";
    $("doneBreak").innerHTML = clean ? `All ${bt.waves} waves cleared!<br>Gems found 💎 ${runGems}` : `You reached wave ${BT.wave} of ${bt.waves}<br>Gems found 💎 ${runGems} (kept!)`;
    if (clean){
      rec.wins++; track("battles", 1);
      if (S.battleDaily !== today()){ S.battleDaily = today(); S.shards += 2; notes.push("📅 First battle win today: +2 ✨"); }
      pendingRewards.push(["battle", BT.tier]);
    } else notes.push("Collect ❤️ hearts dropped by monsters to last longer!");
    addBtn(clean ? "Battle again" : "Try again", () => startBattle(BT.tier), true);
    addBtn("Battles", renderBattle); addBtn("Home", goHome);
  } else if (mode === "party"){
    const pd = PARTY.find(p => p.id === party), sc = partyScore;
    runGems += sc * pd.mult * (weekEvent().id === "party" ? 2 : 1); xp += 15 + sc; track("party");
    const best = S.partyBest[party] || 0;
    $("doneTitle").innerHTML = sc > best && best ? 'New <span>high score!</span>' : 'Time\'s <span>up!</span>';
    $("doneName").textContent = pd.icon + " " + pd.name;
    $("doneScore").textContent = sc + " " + pd.unit;
    $("doneBreak").innerHTML = `Gems earned 💎 ${runGems}<br>High score: ${Math.max(best, sc)}`;
    if (sc > best){ S.partyBest[party] = sc; if (best) notes.push("🏆 You beat your best of " + best + "!"); }
    if (sc >= 15 && Math.random() < 0.3) pendingRewards.push([{ egg:1 }, "🥚 Party prize egg!"]);
    addBtn("Play again", () => startParty(party), true);
    addBtn("Party Games", renderParty);
    addBtn("Home", goHome);
  } else if (mode === "titan"){
    ensureQuests();
    const dmg = titanStartHp - boss.hp, before = S.titan.dmg;
    S.titan.dmg = Math.min(TITAN_MAX, S.titan.dmg + dmg);
    const pct = Math.round(100*S.titan.dmg/TITAN_MAX);
    xp += Math.round(dmg/3) + (clean ? 150 : 0);
    if (clean) S.stats.titanWins++;
    $("doneTitle").innerHTML = clean ? 'Titan <span>cleaned!</span>' : 'Great <span>splashing!</span>';
    $("doneName").textContent = "💜 Mega Goo Titan · Week " + (weekIdx() + 1);
    $("doneScore").textContent = dmg + " splash damage";
    $("doneBreak").innerHTML = `Titan is now ${pct}% cleaned (was ${Math.round(100*before/TITAN_MAX)}%)<br>Gems found 💎 ${runGems}`;
    for (const m of TITAN_MILES) if (S.titan.dmg >= TITAN_MAX*m.p/100 && !S.titan.claimed.includes(m.p)){ S.titan.claimed.push(m.p); pendingRewards.push([{ g:m.g, s:m.s, egg:m.egg, item:m.item }, `💜 Titan ${m.p}% reward!`]); }
    if (!clean) notes.push("Come back anytime this week — your damage is saved!");
    if (!clean) addBtn("Fight again", startTitan, true);
    addBtn("Home", goHome, clean);
  } else if (mode === "daily"){
    const timeBonus = clean ? Math.ceil(timeLeft) * 10 : 0, eff = cleaned ? Math.round(Math.max(0, total*25 - shots) * 2 * cleaned / total) : 0;
    const score = cleaned*100 + timeBonus + eff + runGems*5;
    $("doneTitle").innerHTML = clean ? 'Outpost <span>clean!</span>' : 'So <span>close!</span>';
    $("doneName").textContent = "Daily Outpost #" + dayNumber() + " · " + mod.icon + " " + mod.name;
    $("doneScore").textContent = score + " pts";
    $("doneBreak").innerHTML = `Goo ${cleaned}/${total} · Time bonus ${timeBonus} · Water saving ${eff}<br>Gems found 💎 ${runGems}` + (clean ? ` · Star bonus 💎 ${starBonus}` : "");
    const best = S.dailyBest[today()] || 0;
    if (score > best){ S.dailyBest[today()] = score; if (best) notes.push("New best today! 🏆"); } else if (best) notes.push("Today's best: " + best + " pts");
    if (clean){
      xp += 40 + st*10; track("levels"); track("daily"); if (st === 3) track("stars3");
      if (S.lastDaily !== today()){ S.streak = S.lastDaily === yesterday() ? S.streak + 1 : 1; S.lastDaily = today(); S.shards++; runGems += 50; notes.push("✨ Star shard + 50 💎 · 🔥 " + S.streak + " day streak"); }
      if (Math.random() < 0.5) pendingRewards.push([{ egg:1 }, "🥚 Bonus egg drop!"]);
    }
    const lastResult = `💦 Splash Jet — Daily Outpost #${dayNumber()} ${mod.icon}\n${clean ? "★".repeat(st) + "☆".repeat(3-st) : "⏱"} ${score} pts · goo ${cleaned}/${total}`;
    addBtn("Play again", startDaily, true);
    const sb = addBtn("Copy result", async () => { try { await navigator.clipboard.writeText(lastResult); sb.textContent = "Copied!"; } catch(e){ $("doneNote").innerHTML += "<br>" + esc(lastResult.replace("\n"," · ")); } });
    addBtn("Home", goHome);
  } else {
    const l = LEVELS[levelIdx];
    $("doneTitle").innerHTML = clean ? (mode === "boss" ? (opts.queen ? 'Frost Queen <span>melted!</span>' : opts.magma ? 'Magma Goo <span>cooled!</span>' : 'Goo King <span>cleaned!</span>') : 'Outpost <span>clean!</span>') : 'So <span>close!</span>';
    $("doneName").textContent = (levelIdx+1) + ". " + l.name;
    $("doneScore").textContent = clean ? "+" + (runGems + starBonus) + " 💎" : "+" + runGems + " 💎 kept";
    $("doneBreak").innerHTML = mode === "boss" ? (clean ? `Boss bonus included · Star bonus 💎 ${starBonus}` : `The Goo King had ${Math.ceil(100*boss.hp/boss.max)}% left. You got this!`) : `Goo ${cleaned}/${total} · Gems found 💎 ${runGems}` + (clean ? ` · Star bonus 💎 ${starBonus}` : " · Your gems are kept!");
    if (clean){
      if ((mode === "level" || mode === "boss") && levelIdx === LEVELS.length - 1) addEndlessLevel();
      xp += mode === "boss" ? 100 : 20 + st*10; track("levels"); if (st === 3) track("stars3");
      if (mode === "boss"){ if (opts.queen) S.stats.queens++; else if (opts.magma) S.stats.magma++; else S.stats.bosses++; }
      const prev = S.stars[levelIdx] || 0; if (st > prev) S.stars[levelIdx] = st;
      if (!prev && levelIdx < LEVELS.length - 1) notes.push("🔓 " + LEVELS[levelIdx+1].name + " unlocked!");
      if (mode === "boss" && !prev) notes.push(opts.magma ? "🌋 You beat Magma Goo! You're a true Galaxy Hero!" : opts.queen ? "❄️ You beat the Frost Queen! World 3 is open!" : "👑 You beat the Goo King! World 2 is open!");
      if (mode === "boss" || Math.random() < 0.3) pendingRewards.push([{ egg:1 }, "🥚 Egg drop!"]);
      if (runTreasure) pendingRewards.push([{ g:50, s:1, egg: Math.random() < 0.4 ? 1 : 0 }, "🗝️ Hidden treasure chest!"]);
      addBtn(levelIdx < LEVELS.length - 1 ? "Next outpost →" : "Home", () => levelIdx < LEVELS.length - 1 ? startLevel(levelIdx + 1) : goHome(), true);
    }
    addBtn(clean ? "Replay" : "Try again", () => startLevel(levelIdx), !clean);
    addBtn("Map", renderMap);
  }
  if (clean && mode !== "titan" && mode !== "party" && mode !== "battle" && mode !== "custom" && mode !== "race") S.gems += starBonus;
  S.gems += runGems;
  const bud = buddyInfo(); if (bud) notes.push(`${bud.p.e} ${bud.p.name} helped out!`);
  const sxp = mode === "custom" ? 0 : runGoo*10 + Math.round(xp*0.8) + 20; addSeasonXP(sxp);
  notes.unshift(`+${xp} XP · +${sxp} Season XP`);
  addXP(xp); checkAwards(); save(); syncLB();
  $("doneNote").innerHTML = notes.map(esc).join("<br>");
  show("done");
  if (mode !== "custom" && (clean || mode === "party" || mode === "titan") && Math.random() < 0.5) pendingRewards.push(["sticker"]);
  if (pendingRewards.length){ currentPanel = () => show("done"); setTimeout(() => { pendingRewards.forEach(([r, t]) => r === "battle" ? battleChest(t) : r === "sticker" ? giveSticker() : grantReward(r, t)); }, 700); }
}

// ================= wiring =================
$("quitBtn").onclick = quit;
$("muteBtn").onclick = () => { S.muted = !S.muted; save(); $("muteBtn").textContent = S.muted ? "🔇" : "🔊"; if (S.muted) stopMusic(); else startMusic(); };
$("musicBtn").onclick = () => { S.musicOn = !S.musicOn; save(); updateMusicButton(); if (S.musicOn) startMusic(); else stopMusic(); };
updateMusicButton();

gen(hashStr("level-0"), LEVELS[0]); resetPlayer();
ensureQuests(); checkAwards(); save(); goHome();

let last = performance.now();
function loop(now){
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  update(dt/2); update(dt/2);
  render(); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
